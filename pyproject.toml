[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yearbeyond-data-pipeline"
version = "0.1.0"
description = "Reproducible extraction and transformation pipeline for challenge Sections 0-2"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.43.98",
  "h3==4.5.0",
]

[project.scripts]
yearbeyond-section1 = "yearbeyond_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
